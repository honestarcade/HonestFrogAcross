# Validation for the Play service account (#24): proves the secret's JSON
# authenticates against the Play Developer API with access to our package,
# before the release pipeline depends on it. Dispatch manually.
#
# It also probes STORE LISTING write access (#67) — creating an edit only
# proves release permission, which the account already had, so the listing
# grant needs its own probe. Every edit here is discarded, never committed:
# nothing this workflow does can change the live listing.
name: Play API check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate service account
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$PLAY_SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
      - name: Create and discard an edit (proves app-scoped API access)
        run: |
          TOKEN=$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/androidpublisher)
          PKG=com.honestarcade.frogacross
          HTTP=$(curl -s -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Play API edit-create returned HTTP $HTTP for $PKG"
            echo "Response body:"; cat "$RUNNER_TEMP/resp.json"
            exit 1
          fi
          RESP=$(cat "$RUNNER_TEMP/resp.json")
          EDIT_ID=$(echo "$RESP" | jq -r .id)
          echo "Edit created: $EDIT_ID"

          SA_EMAIL=$(jq -r .client_email "$RUNNER_TEMP/sa.json")
          BASE="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits/$EDIT_ID"

          # Read the listings that exist today
          LIST_HTTP=$(curl -s -o "$RUNNER_TEMP/listings.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE/listings")
          LANGS=$(jq -r '[.listings[]?.language] | join(", ")' "$RUNNER_TEMP/listings.json" 2>/dev/null)

          # Write one back inside the throwaway edit: this is the call that
          # needs "Edit store listing, pricing & distribution"
          TITLE=$(jq -r '.listings[]? | select(.language=="en-US") | .title // empty' "$RUNNER_TEMP/listings.json")
          [ -n "$TITLE" ] || TITLE="Frog Across"
          WRITE_HTTP=$(curl -s -o "$RUNNER_TEMP/write.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$TITLE" '{title:$t}')" \
            "$BASE/listings/en-US")

          # Discard the edit — nothing above reaches the live listing
          curl -sf -X DELETE -H "Authorization: Bearer $TOKEN" "$BASE" || true

          {
            printf '## Play API access\n\n'
            printf -- '- Service account: `%s`\n' "$SA_EMAIL"
            printf -- '- Edit create/discard for `%s`: **OK**\n' "$PKG"
            printf -- '- Listings read (HTTP %s): %s\n' "$LIST_HTTP" "${LANGS:-none yet}"
            if [ "$WRITE_HTTP" = "200" ]; then
              printf -- '- Listing **write** (HTTP 200): **granted** — the listing can be pushed from CI\n'
            else
              printf -- '- Listing write (HTTP %s): **NOT granted**\n' "$WRITE_HTTP"
              printf -- '\n```\n%s\n```\n' "$(cat "$RUNNER_TEMP/write.json")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WRITE_HTTP" != "200" ]; then
            echo "::error::Listing write returned HTTP $WRITE_HTTP — the store-listing permission is missing"
            cat "$RUNNER_TEMP/write.json"
            exit 1
          fi
