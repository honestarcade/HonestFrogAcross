name: Story
description: Describes WHAT to build, with testable acceptance criteria and a test plan
labels: ["feature"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What to build and why — no implementation detail.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Testable criteria, one checkbox each.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: must-haves
    attributes:
      label: Must-haves
      description: "truths: (user-observable statements this story makes true), artifacts: (files that make each truth possible), key_links: (the connections where stubs hide)."
      value: |
        truths:
          - ""
        artifacts:
          - path: ""
            provides: ""
        key_links:
          - from: ""
            to: ""
            via: ""
    validations:
      required: false
  - type: textarea
    id: demo
    attributes:
      label: Demo
      description: User-facing stories only — a concrete ~60-second user script with specific actions and observable outcomes.
    validations:
      required: false
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Automated tests written as part of this story; they must pass before the story is done.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Blocked by: #N lines, if not linked natively."
    validations:
      required: false
